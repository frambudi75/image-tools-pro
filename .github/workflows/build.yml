name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags starting with v, e.g., v6.0.0
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean "Image Tools PRO v6.0.0.spec"

      - name: Prepare assets
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "dist/Image Tools PRO v6.0.0.exe" "dist/Image-Tools-PRO-Windows.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            chmod +x "dist/Image Tools PRO v6.0.0"
            zip -j "dist/Image-Tools-PRO-macOS.zip" "dist/Image Tools PRO v6.0.0"
          else
            chmod +x "dist/Image Tools PRO v6.0.0"
            zip -j "dist/Image-Tools-PRO-Linux.zip" "dist/Image Tools PRO v6.0.0"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Image-Tools-PRO-Windows.exe
            dist/Image-Tools-PRO-macOS.zip
            dist/Image-Tools-PRO-Linux.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
